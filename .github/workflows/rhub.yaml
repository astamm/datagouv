# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
        # TEMPORARY: exclude the R-devel containers still pinned to a broken
        # snapshot. These images carry R-devel r89629 (2026-03-15) / r89623
        # (2026-03-14), which predates the `R_envSymbols` header symbol added
        # in r89633 by hours. Current rlang (>= 1.1.7 on CRAN, any release
        # >= 1.2.0/maint) cannot compile from source against those headers
        # ("implicit declaration of function 'R_envSymbols'"), and the
        # "Build dependencies from source" step below must force source builds
        # to avoid r-hub's miscompiled prebuilt binaries. This is a transient
        # upstream condition: the containers fail only until r-hub rebuilds
        # them past r89633. Drop this block (and re-enable the full matrix)
        # once these images move off the stale snapshot. The newer-snapshot
        # devel containers (clang-asan/ubsan, clang21/22, gcc-asan, gcc16,
        # ubuntu-*) still provide R-devel coverage.
        exclude:
          - config:
              name: clang16
          - config:
              name: clang17
          - config:
              name: clang18
          - config:
              name: clang19
          - config:
              name: clang20
          - config:
              name: gcc13
          - config:
              name: gcc14
          - config:
              name: gcc15
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Install wget and gdebi (Linux container)
        run: |
          if command -v apt-get &> /dev/null; then
            apt-get update -y && apt-get install -y wget gdebi-core
          elif command -v dnf &> /dev/null; then
            dnf install -y wget
          elif command -v yum &> /dev/null; then
            yum install -y wget
          fi
      - name: Install Quarto (Linux container)
        run: |
          QUARTO_VERSION="1.9.38"
          if command -v apt-get &> /dev/null; then
            curl -L -o quarto.deb "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
            gdebi --non-interactive quarto.deb
          elif command -v dnf &> /dev/null; then
            # Quarto publishes the RPM under the x86_64 arch tag (the .deb keeps amd64);
            # the linux-amd64.rpm name does not exist and 404s.
            curl -L -o quarto.rpm "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-x86_64.rpm"
            dnf install -y quarto.rpm
          elif command -v yum &> /dev/null; then
            curl -L -o quarto.rpm "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-x86_64.rpm"
            yum install -y quarto.rpm
          fi
      # R-hub Linux containers can ship prebuilt CRAN binary packages (from the
      # r-hub/repos mirror) built against a different compiler/R configuration
      # than the container itself. Loading those miscompiled packages (e.g.
      # vctrs via dplyr/tibble/readr) fails at vignette build time with
      # "symbol bindings not supported yet". Force pak to install only source
      # deliverables so every package is compiled against the container's R.
      # This is the `platforms` config entry (see pak/pkgdepends docs), set as
      # an R option which `setup-deps` (pak) reads.
      - name: Build dependencies from source (containers)
        env:
          RHUB_RPROFILE: ${{ github.workspace }}/.rhub-Rprofile.site
        run: |
          printf 'options(pkg.platforms = "source")\n' \
            > "$RHUB_RPROFILE"
          echo "R_PROFILE=$RHUB_RPROFILE" >> "$GITHUB_ENV"
          echo "PKG_PLATFORMS=source" >> "$GITHUB_ENV"
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Explicitly install Quarto (r-hub's setup-deps passes install-quarto:
      # false, so Windows/macOS would otherwise lack Quarto for the vignette)
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
